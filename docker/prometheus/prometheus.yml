# Prometheus Configuration for celia.pro
# Scrapes backend /metrics endpoint every 15 seconds

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ============= BACKEND METRICS =============
  - job_name: 'celia-backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'celia-backend'
          environment: 'production'

  # ============= PROMETHEUS SELF-MONITORING =============
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
