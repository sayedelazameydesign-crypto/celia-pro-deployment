# celia.pro Nginx Configuration
# Optimized for React SPA with code-split bundles + API proxy
# Version: 3.2.0 (P2-6 optimized)

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ============= SECURITY HEADERS =============
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ============= GZIP COMPRESSION =============
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/json
        application/javascript
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ============= SPA ROUTING =============
    # For React Router - all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============= CACHED ASSETS (Code-split chunks) =============
    # JS chunks with content-hash - immutable long-term cache
    location /assets/js/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS files with content-hash - immutable long-term cache
    location /assets/css/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images with content-hash
    location /assets/images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============= INDEX.HTML (never cache) =============
    # index.html references hashed assets, so it must always be fresh
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ============= BACKEND API PROXY =============
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Connection handling
        proxy_set_header Connection "";

        # Timeouts (LLM calls can be slow)
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;

        # Don't cache API responses
        add_header Cache-Control "no-store";
    }

    # ============= WEBSOCKET PROXY =============
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============= PROMETHEUS METRICS (restrict in production) =============
    # Uncomment and restrict to monitoring IPs in production
    # location /metrics {
    #     allow 10.0.0.0/8;
    #     allow 172.16.0.0/12;
    #     deny all;
    #     proxy_pass http://backend;
    # }

    # ============= HEALTH CHECK =============
    location = /health {
        proxy_pass http://backend/api/health;
        access_log off;
        add_header Cache-Control "no-store";
    }

    # ============= BLOCK SENSITIVE FILES =============
    location ~ /\.(git|env|htaccess) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============= ERROR PAGES =============
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
