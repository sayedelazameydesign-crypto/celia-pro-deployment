name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  AUTH_REQUIRED: 'false'

jobs:
  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio black flake8
    
    - name: Check code formatting with Black
      run: |
        cd backend
        black --check . || echo "Black formatting issues found (non-blocking)"
      continue-on-error: true
    
    - name: Lint with flake8
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Flake8 issues found (non-blocking)"
      continue-on-error: true
    
    - name: Run tests with pytest
      env:
        AUTH_REQUIRED: 'false'
        DATABASE_URL: 'sqlite+aiosqlite:///./test.db'
      run: |
        cd backend
        pytest tests/ -v --tb=short --cov=core --cov=api --cov-report=term-missing
    
    - name: Generate coverage report
      run: |
        cd backend
        pytest --cov=core --cov=api --cov-report=xml:coverage.xml
      continue-on-error: true

  # Frontend Build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package.json'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/
        retention-days: 7

  # Code Quality Check
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Scan for leaked secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        extra_args: --only-verified

    - name: Check for secrets (manual patterns)
      run: |
        echo "Checking for hardcoded secrets..."
        # Check for common secret patterns
        if grep -r "password\s*=\s*['\"].*['\"]" backend/ --include="*.py" | grep -v "test" | grep -v "#"; then
          echo "⚠️  Warning: Possible hardcoded passwords found"
        fi
        if grep -r "api_key\s*=\s*['\"].*['\"]" backend/ --include="*.py" | grep -v "test" | grep -v "#"; then
          echo "⚠️  Warning: Possible hardcoded API keys found"
        fi
        echo "✅ Secret check completed (automated + pattern-based)"
    
    - name: Validate requirements files
      run: |
        echo "Validating requirements files..."
        if [ -f backend/requirements.txt ]; then
          echo "✅ backend/requirements.txt exists"
        fi
        if [ -f frontend/package.json ]; then
          echo "✅ frontend/package.json exists"
        fi

  # Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, code-quality]
    if: always()
    
    steps:
    - name: Check results
      run: |
        echo "=== CI/CD Pipeline Summary ==="
        echo "Backend Tests: ${{ needs.backend-test.result }}"
        echo "Frontend Build: ${{ needs.frontend-build.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        
        if [[ "${{ needs.backend-test.result }}" == "failure" ]] || \
           [[ "${{ needs.frontend-build.result }}" == "failure" ]]; then
          echo "❌ CI Failed - Please fix the issues above"
          exit 1
        else
          echo "✅ CI Passed - All checks passed"
        fi
