# celia.pro Docker Compose Configuration
# Production-ready multi-container setup
# Version: 3.2.0 (with monitoring stack)

version: '3.8'

services:
  # ============= POSTGRESQL DATABASE =============
  postgres:
    image: postgres:16-alpine
    container_name: celia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-celia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-celia_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-celia_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-celia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celia-network

  # ============= REDIS (Caching & Sessions) =============
  redis:
    image: redis:7-alpine
    container_name: celia-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-celia_redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celia-network

  # ============= BACKEND (FastAPI) =============
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: celia-backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-celia}:${POSTGRES_PASSWORD:-celia_secure_password}@postgres:5432/${POSTGRES_DB:-celia_db}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-celia_redis_password}@redis:6379/0
      
      # Authentication
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production-use-openssl-rand-hex-32}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      
      # Monitoring (P2-5)
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SENTRY_DSN: ${SENTRY_DSN:-}
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      
      # Application
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      PORT: 8000
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - celia-network

  # ============= FRONTEND (React + Nginx) =============
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: celia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - celia-network

  # ============= PROMETHEUS (Monitoring) - OPTIONAL =============
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: celia-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - celia-network
    profiles:
      - monitoring

  # ============= GRAFANA (Dashboards) - OPTIONAL =============
  grafana:
    image: grafana/grafana:10.2.0
    container_name: celia-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - celia-network
    profiles:
      - monitoring

# ============= VOLUMES =============
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============= NETWORKS =============
networks:
  celia-network:
    driver: bridge
    name: celia-network
