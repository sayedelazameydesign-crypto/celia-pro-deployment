[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celia-pro"
version = "3.2.0"
description = "Advanced multi-tool AI agent system powered by celia.pro"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Celia.pro Team"}
]

dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.5.0",
    "pydantic[email]>=2.5.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "websockets>=17.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.19.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "tools*", "database*", "auth*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
